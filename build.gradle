plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.neoforged.moddev' version '2.0.147'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude 'src/generated/**/.cache'
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

if (project.hasProperty('buildRoot')) {
    layout.buildDirectory = file(project.property('buildRoot').toString())
}

neoForge {
    version = project.neo_version

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.quickPlay.toString()
            }
        }

        server {
            server()
            gameDirectory = project.file('run')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'faktocraft.energyAudit', (project.findProperty('energyAudit') ?: 'false').toString()
            systemProperty 'faktocraft.testFilter', (project.findProperty('tests') ?: '').toString()
            systemProperty 'faktocraft.legacyFixture', (project.findProperty('legacyFixture') ?: '').toString()
            systemProperty 'faktocraft.parityFixture', file('docs/fixtures/parity-1201').absolutePath
        }

        data {
            clientData()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

checkstyle {
    toolVersion = '11.1.0'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
}

def modProfiles = [
    default    : ['jei', 'jade'],
    alternative: ['rei', 'architectury', 'clothconfig', 'jade'],
    production : ['sodium', 'distanthorizons', 'jei', 'jade'],
]

def modRuntimeDeps = [
    jei            : ["mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"],
    jade           : ["maven.modrinth:jade:${jade_version}"],
    rei            : ["maven.modrinth:rei:${rei_version}+neoforge"],
    architectury   : ["maven.modrinth:architectury-api:${architectury_version}"],
    clothconfig    : ["maven.modrinth:cloth-config:${cloth_config_version}"],
    sodium         : ["maven.modrinth:sodium:${sodium_version}"],
    distanthorizons: ["maven.modrinth:distanthorizons:${distant_horizons_version}"],
]

def modProfile = (project.findProperty('profile') ?: 'default').toString()
if (!modProfiles.containsKey(modProfile)) {
    throw new GradleException("Unknown mod profile '${modProfile}'. Available: ${modProfiles.keySet().join(', ')}")
}
logger.lifecycle("Mod profile: ${modProfile} -> ${modProfiles[modProfile].join(', ')}")

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

neoForge.addModdingDependenciesTo(sourceSets.gametest)

dependencies {
    gametestCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    gametestCompileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    compileOnly "maven.modrinth:jade:${jade_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-api-neoforge:${rei_version}"
    compileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-neoforge:${rei_version}"

    modProfiles[modProfile].each { mod ->
        modRuntimeDeps[mod].each { coordinate ->
            localRuntime(coordinate) { transitive = false }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xmaxerrs', '5000', '-Xmaxwarns', '10'])
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
