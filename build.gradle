plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file('run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'faktocraft.energyAudit', (project.findProperty('energyAudit') ?: 'false')
            property 'faktocraft.testFilter', (project.findProperty('tests') ?: '')
            property 'faktocraft.legacyFixture', (project.findProperty('legacyFixture') ?: '')
            property 'faktocraft.paritySnapshot', (project.findProperty('paritySnapshot') ?: '')
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.matching { it.name == 'prepareRuns' }.configureEach { dependsOn 'createSrgToMcp' }

checkstyle {
    toolVersion = '10.12.4'
    configFile = file('config/checkstyle/checkstyle.xml')
    ignoreFailures = true
}

repositories {
    mavenCentral()
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Modrinth'
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Shedaniel'
        url 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
        }
    }
    maven {
        name = 'Architectury'
        url 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'WTHIT'
        url 'https://maven2.bai.lol'
        content {
            includeGroup 'mcp.mobius.waila'
            includeGroup 'lol.bai'
        }
    }
}

def modProfiles = [
    default    : ['jei', 'jade'],
    alternative: ['rei', 'wthit'],
    production : ['embeddium', 'distanthorizons', 'jei', 'jade', 'oculus'],
]

def modRuntimeDeps = [
    jei            : ["mezz.jei:jei-1.20.1-forge:${jei_version}"],
    jade           : ["maven.modrinth:jade:${jade_version}"],
    rei            : ["me.shedaniel:RoughlyEnoughItems-forge:${rei_version}",
                      "dev.architectury:architectury-forge:${architectury_version}",
                      "me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}"],
    wthit          : ["mcp.mobius.waila:wthit:forge-${wthit_version}",
                      "lol.bai:badpackets:forge-${badpackets_version}"],
    embeddium      : ["maven.modrinth:embeddium:${embeddium_version}"],
    distanthorizons: ["maven.modrinth:distanthorizons:${distant_horizons_version}"],
    oculus         : ["maven.modrinth:oculus:${oculus_version}"],
]

def modProfile = (project.findProperty('profile') ?: 'default').toString()
if (!modProfiles.containsKey(modProfile)) {
    throw new GradleException("Unknown mod profile '${modProfile}'. Available: ${modProfiles.keySet().join(', ')}")
}
logger.lifecycle("Mod profile: ${modProfile} -> ${modProfiles[modProfile].join(', ')}")

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-1.20.1-forge-api:${jei_version}"))
    compileOnly(fg.deobf("maven.modrinth:jade:${jade_version}"))

    modProfiles[modProfile].each { mod ->
        modRuntimeDeps[mod].each { coordinate ->
            runtimeOnly(fg.deobf(coordinate)) { transitive = false }
        }
    }

    compileOnly(fg.deobf("me.shedaniel:RoughlyEnoughItems-api-forge:${rei_version}"))
    compileOnly(fg.deobf("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}"))
    compileOnly(fg.deobf("dev.architectury:architectury-forge:${architectury_version}"))
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1")
    compileOnly(fg.deobf("mcp.mobius.waila:wthit-api:forge-${wthit_version}"))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
    from('LICENSE')
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
